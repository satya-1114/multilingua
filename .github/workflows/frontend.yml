name: frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend.yml"

  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run typecheck
      - run: bun run build