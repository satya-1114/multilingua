apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: platform
  labels: { app: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: platform/frontend:latest
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: platform }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]