apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: platform
  labels: { app: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: platform/backend:latest
          command: ["celery", "-A", "app.runtime.scheduler.celery_app.workflow_celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
          livenessProbe:
            exec: { command: ["celery", "-A", "app.runtime.scheduler.celery_app.workflow_celery_app", "inspect", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10