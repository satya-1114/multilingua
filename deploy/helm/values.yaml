global:
  namespace: platform
  imagePullPolicy: IfNotPresent
image:
  backend: { repository: platform/backend, tag: latest }
  frontend: { repository: platform/frontend, tag: latest }
backend:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
worker:
  replicaCount: 2
  concurrency: 4
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 20, targetCPUUtilizationPercentage: 75 }
scheduler:
  replicaCount: 1
frontend:
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
ingress:
  enabled: true
  className: nginx
  host: app.example.com
  tls: true
  tlsSecretName: platform-tls
config:
  appEnv: production
  logLevel: INFO
  corsOrigins: "https://app.example.com"
  rateLimitEnabled: "true"
existingSecret: platform-secrets