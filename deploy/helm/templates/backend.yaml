apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "platform.namespace" . }}
  labels: { app: backend }
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health/live,  port: 8000 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: {{ include "platform.namespace" . }} }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]