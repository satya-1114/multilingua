apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "platform.namespace" . }}
  labels: { app: frontend }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: {{ include "platform.namespace" . }} }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 8080 }]