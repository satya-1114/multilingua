apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: {{ include "platform.namespace" . }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}